[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dialektos"
version = "0.1.0"
description = "Dialektos - Sistema RAG Adaptativo con Bio-Adaptabilidad"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "David Arroyo"}
]

dependencies = [
    "langchain==0.1.9",
    "langchain-community==0.0.24",
    "langchain-openai>=0.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers==2.5.1",
    "torch>=2.0.0",
    "pypdf==4.0.1",
    "openai>=2.20.0",
    "httpx>=0.27.0,<0.28.0",
    "python-dotenv==1.0.1",
    "numpy==1.26.4",
    "pandas==2.2.0",
    "sqlmodel>=0.0.14",
    "tavily-python==0.3.3",
    "streamlit==1.31.1",
    "matplotlib==3.8.3",
    "plotly==5.19.0",
    "tiktoken==0.6.0",
    "pyyaml>=6.0",
    "requests==2.31.0",
    "pydantic>=2.7.0",
    "tqdm>=4.66.0",
    "seaborn==0.13.2",
    "scipy>=1.12.0",
    "pingouin>=0.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
